name: Release

# Builds native installers for macOS, Windows, and Linux and attaches them
# to a GitHub Release. Triggered by pushing a tag like "v0.1.0" — bump
# package.json's and src-tauri/tauri.conf.json's version fields together,
# commit, then: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workingDirectories: src-tauri

      - name: Install Tauri Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for the auto-updater: tauri-action signs each build and
          # publishes a latest.json update manifest alongside the installers
          # when these are set. See README.md's release section for how to
          # generate this key and add it as a repo secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Satori ${{ github.ref_name }}"
          # false, not true: a draft release is invisible on the public
          # Releases page until someone manually publishes it — which is
          # also why the auto-updater's "latest release" endpoint would
          # never resolve to anything. Auto-publishing is what makes both
          # the Releases page and the updater actually work.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
