[package]
name = "app"
version = "0.1.2"
description = "Satori — a privacy-first, local-first, end-to-end encrypted networked notes app"
authors = ["Ankush"]
license = "MIT"
repository = "https://github.com/mystic-monk/satori"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "serde_json"] }
walkdir = "2.5.0"
regex = "1.13.1"
rand = "0.9.5"
chrono = { version = "0.4.45", features = ["serde"] }
serde_yaml = "0.9.34"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
rfd = "0.17.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-global-shortcut = "2.3.2"
